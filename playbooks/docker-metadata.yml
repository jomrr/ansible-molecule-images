---
# repo: jomrr/ansible-molecule-images
# file: playbooks/docker-metadata.yml

- name: "Update Docker Hub repository metadata"
  hosts: localhost
  gather_facts: false
  vars:
    dockerhub_apply: true
    dockerhub_available_groups: >-
      {{
        groups.keys()
        | difference(['all', 'ungrouped', 'localhost'])
        | list
        | sort
      }}
    dockerhub_groups: >-
      {{
        [dockerhub_filter | default(dockerhub_available_groups)]
        | flatten
        | unique
        | sort
      }}
    dockerhub_namespace: "{{ lookup('ansible.builtin.env', 'DOCKER_USER') }}"
  tasks:
    - name: "Validate requested Docker Hub groups"
      ansible.builtin.assert:
        that:
          - item in dockerhub_available_groups
        fail_msg: >-
          Unknown Docker Hub group '{{ item }}'.
          Available groups: {{ dockerhub_available_groups | join(', ') }}
        quiet: true
      loop: "{{ dockerhub_groups }}"
      loop_control:
        label: "{{ item }}"

    - name: "Select inventory hosts from requested groups"
      ansible.builtin.set_fact:
        _host_entries: >-
          {{
            dockerhub_groups
            | map('extract', groups)
            | flatten
            | unique
            | list
            | sort
          }}

    - name: "Build Docker Hub repository list"
      ansible.builtin.set_fact:
        _repos: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for host in _host_entries -%}
            {%- set entry = {
              'display_name': hostvars[host].display_name,
              'pull_image': hostvars[host].pull_image,
              'repo': hostvars[host].push_repo,
              'slug': hostvars[host].push_image
            } -%}
            {%- if entry not in ns.items -%}
              {%- set _ = ns.items.append(entry) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.items }}

    - name: "Create metadata render directories"
      ansible.builtin.file:
        path: "{{ build_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ _repos | map(attribute='slug') | list }}"

    - name: "Render repository short descriptions"
      ansible.builtin.template:
        src: "templates/dockerhub/description.txt.j2"
        dest: "{{ build_dir }}/{{ item.slug }}/description.txt"
        mode: "0644"
      loop: "{{ _repos }}"

    - name: "Render repository full descriptions"
      ansible.builtin.template:
        src: "templates/dockerhub/full_description.md.j2"
        dest: "{{ build_dir }}/{{ item.slug }}/full_description.md"
        mode: "0644"
      loop: "{{ _repos }}"

    - name: "Apply Docker Hub repository metadata changes"
      when: dockerhub_apply | bool
      block:
        - name: "Build desired Docker Hub repository metadata"
          ansible.builtin.set_fact:
            _dockerhub_desired_metadata: >-
              {{
                (_dockerhub_desired_metadata | default([]))
                + [{
                  'repository': repository.repo,
                  'description': lookup(
                    'ansible.builtin.file',
                    build_dir ~ '/' ~ repository.slug ~ '/description.txt'
                  ) | trim,
                  'full_description': lookup(
                    'ansible.builtin.file',
                    build_dir ~ '/' ~ repository.slug ~
                    '/full_description.md'
                  )
                }]
              }}
          loop: "{{ _repos }}"
          loop_control:
            loop_var: repository
            label: "{{ repository.repo }}"

        - name: "Authenticate with Docker Hub"
          no_log: true
          ansible.builtin.uri:
            url: "https://hub.docker.com/v2/auth/token"
            method: POST
            body_format: json
            body:
              identifier: "{{ dockerhub_namespace }}"
              secret: "{{ lookup('ansible.builtin.env', 'DOCKER_SECRET') }}"
            headers:
              Content-Type: "application/json"
            return_content: true
            status_code: 200
          register: _dockerhub_auth

        - name: "Fetch current Docker Hub repository metadata"
          no_log: true
          ansible.builtin.uri:
            url: >-
              https://hub.docker.com/v2/namespaces/{{ dockerhub_namespace
              }}/repositories/{{ desired_metadata.repository }}
            method: GET
            headers:
              Authorization: "Bearer {{ _dockerhub_auth.json.access_token }}"
            return_content: true
            status_code: 200
            unredirected_headers:
              - "Authorization"
          loop: "{{ _dockerhub_desired_metadata }}"
          loop_control:
            loop_var: desired_metadata
            label: "{{ desired_metadata.repository }}"
          register: _dockerhub_current_metadata

        - name: "Update Docker Hub repository metadata"
          no_log: true
          ansible.builtin.uri:
            url: >-
              https://hub.docker.com/v2/repositories/{{ dockerhub_namespace
              }}/{{ metadata_result.desired_metadata.repository }}/
            method: PATCH
            body_format: json
            body:
              description: "{{ metadata_result.desired_metadata.description }}"
              full_description: "{{ metadata_result.desired_metadata.full_description }}"
            headers:
              Authorization: "Bearer {{ _dockerhub_auth.json.access_token }}"
              Content-Type: "application/json"
            status_code: 200
            return_content: true
            unredirected_headers:
              - "Authorization"
          loop: "{{ _dockerhub_current_metadata.results }}"
          loop_control:
            loop_var: metadata_result
            label: "{{ metadata_result.desired_metadata.repository }}"
          when: >-
            metadata_result.json.description
            != metadata_result.desired_metadata.description
            or metadata_result.json.full_description
            != metadata_result.desired_metadata.full_description

# repo: jomrr/ansible-molecule-images
# file: pyproject.toml

[project]
name = "ansible-molecule-images"
version = "2.3.0"
description = "Ansible playbook to build and push container images with init system enabled for molecule tests."
authors = [
    { name = "Jonas Mauer" },
]
license = "MIT"
keywords = ["ansible", "docker", "podman", "molecule", "images"]
requires-python = ">=3.12"
dependencies = [
    "ansible>=2.18",
    "commitizen",
    "pre-commit",
    "python-semantic-release",
]

[project.urls]
Repository = "https://github.com/jomrr/ansible-molecule-images"

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
commit_message = "build(release): version {version}"
major_on_zero = true
upload_to_pypi = false
upload_to_vcs_release = true
version_toml = [
    "pyproject.toml:project.version",
]
